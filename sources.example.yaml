version: 1

career_profile:
  current_compensation:
    currency: ""
    annual_base_salary: null
    scope_note: ""

google_drive:
  workspace_folder:
    url: ""
    use_for:
      - 폴더 구조와 취업준비 자료 탐색
      - 경력과 프로젝트 원본 확인
  experience_index:
    parent: workspace_folder
    folder_name: ""
    use_for:
      - 활용 가능한 경험과 프로젝트의 1차 탐색
      - 경험별 문제, 역할, 판단, 성과와 관련 원본 위치 확인
    authority: navigation_index
  experience_originals:
    parent: workspace_folder
    use_for:
      - 선택한 경험의 사실과 세부 맥락 검증
      - 수치, 기간, 본인 기여, 기술·운영 제약과 산출물 확인
    authority: factual_source
  mentorship_reference:
    url: ""
    use_for:
      - 멘토의 질문 방식과 판단 기준 분석
  interview_question_bank:
    url: ""
    use_for:
      - 공통 면접 질문의 답변 작성 여부와 품질 확인
      - 핵심 경험별 What, How, Why 꼬리질문 점검
  company_research_document:
    url: ""
    prompt_tab: ""
    company_tab_rule: "one_company_per_top_level_tab"
    use_for:
      - 회사별 통합 조사 보고서 작성과 최신화
      - 공통 조사 프롬프트와 기존 보고서 구조 참고

google_calendar:
  primary:
    calendar_id: "primary"
    privacy_mode: availability_only
    use_for:
      - 개인 일정의 busy 시간을 반영한 취준 가용시간 산정
      - 지원 마감과 면접 준비 일정의 충돌 확인

notion:
  application_status:
    url: ""
    use_for:
      - 지원 현황 확인
  essay_archive:
    url: ""
    use_for:
      - 과거 자기소개서의 개인 후킹 서사와 표현 자산 탐색
      - 공고별 제출 문항과 결과 비교
  schedule:
    url: ""
    use_for:
      - 지원 일정과 마감 확인
  availability_calendar:
    url: ""
    use_for:
      - 개인 할 일과 프로젝트를 반영한 일간 취준 가능량 산정
      - 중요도, 긴급도와 진행 상태를 고려한 우선순위 조정
  job_postings:
    url: ""
    use_for:
      - 신규 공고와 변경 공고 분석
      - 어필 키워드 변화 추적

chatgpt_work:
  application_customization:
    project_name: ""
    project_id: ""
    use_for:
      - 이전 지원서 커스텀 대화와 소스 사용 방식 참고
