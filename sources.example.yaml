    url: ""
    use_for:
      - 폴더 구조와 취업준비 자료 탐색
      - 경력과 프로젝트 원본 확인
  mentorship_reference:
    url: ""
    use_for:
      - 멘토의 질문 방식과 판단 기준 분석
  interview_question_bank:
    url: ""
    use_for:
      - 공통 면접 질문의 답변 작성 여부와 품질 확인
      - 핵심 경험별 What, How, Why 꼬리질문 점검

google_calendar:
  primary:
    calendar_id: "primary"
    privacy_mode: availability_only
    use_for:
      - 개인 일정의 busy 시간을 반영한 취준 가용시간 산정
      - 지원 마감과 면접 준비 일정의 충돌 확인

notion:
  application_status:
    url: ""
    use_for:
      - 지원 현황 확인
  essay_archive:
    url: ""
    use_for:
      - 과거 자기소개서의 개인 후킹 서사와 표현 자산 탐색
      - 공고별 제출 문항과 결과 비교
  schedule:
    url: ""
    use_for:
      - 지원 일정과 마감 확인
  availability_calendar:
    url: ""
    use_for:
      - 개인 할 일과 프로젝트를 반영한 일간 취준 가능량 산정
      - 중요도, 긴급도와 진행 상태를 고려한 우선순위 조정
  job_postings:
    url: ""
    use_for:
      - 신규 공고와 변경 공고 분석
      - 어필 키워드 변화 추적

